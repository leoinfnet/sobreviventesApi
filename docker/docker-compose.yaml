services:
  postgres:
    image: postgres:17.8-alpine3.23
    container_name: survivor-postgres
    environment:
      POSTGRES_DB: survivor_db
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppass
    ports:
      - "5432:5432"
    volumes:
      - survivor_pgdata:/var/lib/postgresql/data
      - ./init/:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d survivor_db"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  survivor_pgdata:
  survivor_redis_data: