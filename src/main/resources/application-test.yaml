spring:
  elasticsearch:
    uris: http://localhost:9200
  data:
    redis:
      host: localhost
      port: 6379
  cache:
    type: redis
  application:
    name: sobreviventesApi
  datasource:
    url: jdbc:postgresql://localhost:5432/survivor_db
    driver-class-name: org.postgresql.Driver
    username: appuser
    password: apppass
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
    #defer-datasource-initialization: true
#  sql:
#    init:
#      mode: never

